services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fixitnow
      POSTGRES_PASSWORD: fixitnow
      POSTGRES_DB: fixitnow
    ports:
      - "5432:5432"
    volumes:
      - fixitnow-postgres:/var/lib/postgresql/data

volumes:
  fixitnow-postgres:
